<title>Anchor Logo-Auswahl</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Auswahlseite für zehn Logo-Entwürfe der App Anchor. Neutrale Oberfläche (Grau, Weiß, IBM Plex), damit sie keinen Entwurf bevorzugt. */
:root {
  color-scheme: dark;
  --bg: #0b0b0d; --panel: #131316; --raise: #1b1b20; --line: #2a2a31; --t1: #f2f2f4; --t2: #a3a3ad; --ok: #5fd08a;
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--t1); font: 400 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 48px; padding-left: var(--gl); padding-right: var(--gr); }
header h1 { font: 600 22px/1.2 var(--font); letter-spacing: -.01em; }
header p { color: var(--t2); margin-top: 6px; max-width: 62ch; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 28px; margin-top: 24px; align-items: start; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 16px; min-width: 0; }
.card { text-align: left; display: grid; align-content: start; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); min-width: 0; }
.card:hover { background: var(--raise); }
.card[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 1px #fff; background: var(--raise); }
.ico { position: relative; width: 100%; aspect-ratio: 1; border-radius: 22.37%; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.12); background: #000; }
.ico img { display: block; width: 100%; height: 100%; }
.card .nm { display: flex; gap: 8px; align-items: baseline; }
.card .nm b { font: 500 12px var(--mono); color: var(--t2); }
.card .nm span { font-weight: 600; font-size: 15px; }
.card p { color: var(--t2); font-size: 12.5px; line-height: 1.4; }
.detail { position: sticky; top: 16px; display: grid; gap: 18px; padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); min-width: 0; }
.hero { display: flex; gap: 18px; align-items: center; }
.hero .ico { width: 132px; flex: none; }
.hero h2 { font: 600 20px/1.2 var(--font); }
.hero h2 b { font: 500 13px var(--mono); color: var(--t2); margin-right: 8px; }
.hero p { color: var(--t2); margin-top: 6px; font-size: 13px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); font-weight: 500; }
.btn.solid { background: #fff; color: #0b0b0d; border-color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.state { font-size: 13px; color: var(--t2); min-height: 20px; }
.state.ok { color: var(--ok); }
.sec h3 { font: 600 12px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--t2); margin-bottom: 10px; }
.sizes { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.sizes figure { margin: 0; display: grid; gap: 6px; justify-items: center; }
.sizes figcaption { font: 400 11px var(--mono); color: var(--t2); }
.sizes .ico { box-shadow: 0 0 0 1px rgba(255,255,255,.14); }
.seg { display: inline-flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--raise); border: 1px solid var(--line); }
.seg button { height: 28px; padding: 0 12px; border-radius: 7px; font-size: 13px; color: var(--t2); }
.seg button[aria-pressed="true"] { background: #fff; color: #0b0b0d; font-weight: 500; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
.row h3 { margin: 0; }
.phone { border-radius: 34px; padding: 22px 16px 18px; border: 1px solid #2c2c33; position: relative; overflow: hidden; }
.phone.dark { background: radial-gradient(120% 80% at 20% 0%, #1b2748 0%, #0a0c14 60%, #05060a 100%); }
.phone.light { background: radial-gradient(120% 80% at 20% 0%, #cfe0ff 0%, #e9eefb 55%, #f6f3ee 100%); }
.apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; }
.apps.many { grid-template-columns: repeat(5, 1fr); gap: 14px 6px; }
.app { display: grid; gap: 5px; justify-items: center; min-width: 0; }
.app .ico { width: 100%; max-width: 62px; box-shadow: none; }
.app .ph { width: 100%; max-width: 62px; aspect-ratio: 1; border-radius: 22.37%; }
.app span { font-size: 10.5px; line-height: 1.1; color: #f3f4f8; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phone.light .app span { color: #1a1d28; }
.app.me span { font-weight: 600; }
.dockbar { margin-top: 20px; padding: 10px 12px; border-radius: 26px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; justify-items: center; }
.phone.dark .dockbar { background: rgba(255,255,255,.1); }
.phone.light .dockbar { background: rgba(255,255,255,.55); }
.dockbar .ph { width: 100%; max-width: 54px; aspect-ratio: 1; border-radius: 22.37%; }
.num { font: 500 10px var(--mono); color: #aeb4c6; }
.phone.light .num { color: #55607a; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #fff; color: #0b0b0d; padding: 9px 16px; border-radius: 10px; font-weight: 500; z-index: 50; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero .ico { width: 104px; }
}
</style>

<div class="wrap">
  <header>
    <h1>Anchor · Logo-Auswahl</h1>
    <p>Zehn Entwürfe für das App-Symbol. Tippe auf einen, sieh ihn groß, in kleinen Größen und auf dem Home-Bildschirm, und wähle dann dein Logo. Die Reihenfolge ist nur die Nummerierung, keine Wertung.</p>
  </header>
  <div class="layout">
    <section class="grid" id="grid" aria-label="Logo-Entwürfe"></section>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

1=\"0\" y1=\"320\" x2=\"1024\" y2=\"320\"/><line x1=\"384\" y1=\"0\" x2=\"384\" y2=\"1024\"/><line x1=\"0\" y1=\"384\" x2=\"1024\" y2=\"384\"/><line x1=\"448\" y1=\"0\" x2=\"448\" y2=\"1024\"/><line x1=\"0\" y1=\"448\" x2=\"1024\" y2=\"448\"/><line x1=\"512\" y1=\"0\" x2=\"512\" y2=\"1024\"/><line x1=\"0\" y1=\"512\" x2=\"1024\" y2=\"512\"/><line x1=\"576\" y1=\"0\" x2=\"576\" y2=\"1024\"/><line x1=\"0\" y1=\"576\" x2=\"1024\" y2=\"576\"/><line x1=\"640\" y1=\"0\" x2=\"640\" y2=\"1024\"/><line x1=\"0\" y1=\"640\" x2=\"1024\" y2=\"640\"/><line x1=\"704\" y1=\"0\" x2=\"704\" y2=\"1024\"/><line x1=\"0\" y1=\"704\" x2=\"1024\" y2=\"704\"/><line x1=\"768\" y1=\"0\" x2=\"768\" y2=\"1024\"/><line x1=\"0\" y1=\"768\" x2=\"1024\" y2=\"768\"/><line x1=\"832\" y1=\"0\" x2=\"832\" y2=\"1024\"/><line x1=\"0\" y1=\"832\" x2=\"1024\" y2=\"832\"/><line x1=\"896\" y1=\"0\" x2=\"896\" y2=\"1024\"/><line x1=\"0\" y1=\"896\" x2=\"1024\" y2=\"896\"/><line x1=\"960\" y1=\"0\" x2=\"960\" y2=\"1024\"/><line x1=\"0\" y1=\"960\" x2=\"1024\" y2=\"960\"/></g><g fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"512\" cy=\"232\" r=\"54\" stroke=\"#fff\" stroke-width=\"34\"/><path d=\"M512 299.0 V 800\" stroke=\"#fff\" stroke-width=\"34\"/><path d=\"M396 352 H 628\" stroke=\"#fff\" stroke-width=\"34\"/><path d=\"M232 540 C 246 712 364 812 512 812 C 660 812 778 712 792 540\" stroke=\"#fff\" stroke-width=\"34\"/><path d=\"M178 574 L232 502 L286 574\" stroke=\"#fff\" stroke-width=\"34\"/><path d=\"M738 574 L792 502 L846 574\" stroke=\"#fff\" stroke-width=\"34\"/></g><circle cx=\"512\" cy=\"232\" r=\"18\" fill=\"#3d8bff\"/></svg>"}, {"slug": "09-tau", "nr": "09", "name": "Tau", "idea": "Der Anker als gedrehtes Seil, hell auf Schwarz.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" width=\"1024\" height=\"1024\"><defs><pattern id=\"rope\" width=\"30\" height=\"30\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(38)\"><rect width=\"30\" height=\"30\" fill=\"#cfe0ff\"/><rect width=\"15\" height=\"30\" fill=\"#ffffff\"/><rect x=\"14\" width=\"3\" height=\"30\" fill=\"#7fa8f0\"/></pattern></defs><rect width=\"1024\" height=\"1024\" fill=\"#000\"/><g fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"512\" cy=\"232\" r=\"50\" stroke=\"#0a1a3a\" stroke-width=\"84\"/><path d=\"M512 320.0 V 800\" stroke=\"#0a1a3a\" stroke-width=\"84\"/><path d=\"M372 352 H 652\" stroke=\"#0a1a3a\" stroke-width=\"84\"/><path d=\"M232 540 C 246 712 364 812 512 812 C 660 812 778 712 792 540\" stroke=\"#0a1a3a\" stroke-width=\"84\"/><path d=\"M178 574 L232 502 L286 574\" stroke=\"#0a1a3a\" stroke-width=\"84\"/><path d=\"M738 574 L792 502 L846 574\" stroke=\"#0a1a3a\" stroke-width=\"84\"/></g><g fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"512\" cy=\"232\" r=\"50\" stroke=\"url(#rope)\" stroke-width=\"62\"/><path d=\"M512 309.0 V 800\" stroke=\"url(#rope)\" stroke-width=\"62\"/><path d=\"M372 352 H 652\" stroke=\"url(#rope)\" stroke-width=\"62\"/><path d=\"M232 540 C 246 712 364 812 512 812 C 660 812 778 712 792 540\" stroke=\"url(#rope)\" stroke-width=\"62\"/><path d=\"M178 574 L232 502 L286 574\" stroke=\"url(#rope)\" stroke-width=\"62\"/><path d=\"M738 574 L792 502 L846 574\" stroke=\"url(#rope)\" stroke-width=\"62\"/></g></svg>"}, {"slug": "10-aufwind", "nr": "10", "name": "Aufwind", "idea": "Die Spitze des Ankers ist ein Pfeil nach oben: halten und steigern.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" width=\"1024\" height=\"1024\"><defs><linearGradient id=\"bg\" x1=\"0\" y1=\"0\" x2=\"0.5\" y2=\"1\"><stop offset=\"0\" stop-color=\"#1673ff\"/><stop offset=\"1\" stop-color=\"#002c85\"/></linearGradient></defs><rect width=\"1024\" height=\"1024\" fill=\"url(#bg)\"/><g fill=\"none\" stroke=\"#fff\" stroke-width=\"44\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M512 250 V 800\"/><path d=\"M432 330 L512 236 L592 330\"/>\n<path d=\"M396 420 H 628\"/>\n<path d=\"M232 540 C 246 712 364 812 512 812 C 660 812 778 712 792 540\"/>\n<path d=\"M178 574 L232 502 L286 574\"/><path d=\"M738 574 L792 502 L846 574\"/>\n</g></svg>"}];
  var LS = 'anchor-logo-choice-v1';
  var sel = 0, mode = 'single', wall = 'dark', chosen = null, db = null, saving = false;
  var $ = function (id) { return document.getElementById(id); };
  var uri = function (l) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(l.svg); };
  var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var icon = function (l, extra) { return '<div class="ico"' + (extra || '') + '><img alt="" src="' + uri(l) + '"></div>'; };
  var PLACEHOLDERS = [['#3a3f52', 'Notizen'], ['#2d4a3a', 'Karten'], ['#5a3a3a', 'Musik'], ['#3a4a5a', 'Wetter'], ['#4a3a5a', 'Fotos'], ['#55503a', 'Uhr'], ['#3a5555', 'Kamera']];

  function renderGrid() {
    $('grid').innerHTML = LOGOS.map(function (l, i) {
      return '<button class="card" type="button" data-i="' + i + '" aria-pressed="' + (i === sel) + '">' + icon(l) +
        '<div class="nm"><b>' + l.nr + '</b><span>' + esc(l.name) + '</span></div><p>' + esc(l.idea) + '</p></button>';
    }).join('');
  }

  function phoneHTML() {
    var l = LOGOS[sel], h = '<div class="phone ' + wall + '">';
    if (mode === 'single') {
      h += '<div class="apps">';
      var ph = PLACEHOLDERS.slice(0, 3), i;
      for (i = 0; i < 3; i++) h += '<div class="app"><div class="ph" style="background:' + ph[i][0] + '"></div><span>' + ph[i][1] + '</span></div>';
      h += '<div class="app me">' + icon(l) + '<span>Anchor</span></div>';
      for (i = 3; i < 7; i++) h += '<div class="app"><div class="ph" style="background:' + PLACEHOLDERS[i][0] + '"></div><span>' + PLACEHOLDERS[i][1] + '</span></div>';
      h += '</div><div class="dockbar">' + [0, 1, 2, 3].map(function (k) { return '<div class="ph" style="background:' + PLACEHOLDERS[(k * 2) % 7][0] + '"></div>'; }).join('') + '</div>';
    } else {
      h += '<div class="apps many">' + LOGOS.map(function (x, i) {
        return '<div class="app me">' + icon(x) + '<span class="num">' + x.nr + '</span></div>';
      }).join('') + '</div>';
    }
    return h + '</div>';
  }

  function renderDetail() {
    var l = LOGOS[sel], sizes = [120, 76, 60, 40, 29];
    var isChosen = chosen && chosen.slug === l.slug;
    $('detail').innerHTML =
      '<div class="hero">' + icon(l) + '<div><h2><b>' + l.nr + '</b>' + esc(l.name) + '</h2><p>' + esc(l.idea) + '</p></div></div>' +
      '<div class="btns"><button class="btn solid" type="button" id="b-choose"' + (saving ? ' disabled' : '') + '>' + (isChosen ? 'Gewählt' : 'Als Logo wählen') + '</button><button class="btn" type="button" id="b-copy">Auswahl kopieren</button></div>' +
      '<div class="state' + (chosen ? ' ok' : '') + '" id="state">' + (chosen ? 'Dein gewähltes Logo: ' + chosen.nr + ' ' + esc(chosen.name) + '.' : 'Noch nichts gewählt.') + '</div>' +
      '<div class="sec"><h3>Größen</h3><div class="sizes">' + sizes.map(function (s) { return '<figure><div class="ico" style="width:' + s + 'px"><img alt="" src="' + uri(l) + '"></div><figcaption>' + s + '</figcaption></figure>'; }).join('') + '</div></div>' +
      '<div class="sec"><div class="row"><h3>Home-Bildschirm</h3><div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<div class="seg" role="group" aria-label="Ansicht"><button type="button" data-mode="single" aria-pressed="' + (mode === 'single') + '">Einzeln</button><button type="button" data-mode="all" aria-pressed="' + (mode === 'all') + '">Alle zehn</button></div>' +
        '<div class="seg" role="group" aria-label="Hintergrund"><button type="button" data-wall="dark" aria-pressed="' + (wall === 'dark') + '">Dunkel</button><button type="button" data-wall="light" aria-pressed="' + (wall === 'light') + '">Hell</button></div>' +
      '</div></div>' + phoneHTML() + '</div>';
  }

  function toast(m) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2200); }

  function summary() {
    var l = LOGOS[sel];
    return 'Anchor-Logo: ' + l.nr + ' ' + l.name + '\n' + l.idea + '\nDatei: brand/logos/' + l.slug + '.svg';
  }

  async function choose() {
    var l = LOGOS[sel]; saving = true; renderDetail();
    var rec = { slug: l.slug, nr: l.nr, name: l.name, idea: l.idea, chosenAt: new Date().toISOString() };
    chosen = rec;
    try { localStorage.setItem(LS, JSON.stringify(rec)); } catch (e) { /* ohne Speicher weiter */ }
    var where = 'in diesem Browser';
    if (db) { try { await db.doc('logo/choice').set(rec); where = 'gespeichert und für Claude lesbar'; } catch (e) { where = 'nur in diesem Browser'; } }
    saving = false; renderDetail(); toast('Logo ' + l.nr + ' ' + l.name + ' gewählt (' + where + ')');
  }

  function copy() {
    var text = summary();
    function fb() { toast('Kopieren nicht möglich. Text: ' + text.split('\n')[0]); }
    try { navigator.clipboard.writeText(text).then(function () { toast('Auswahl kopiert'); }, fb); } catch (e) { fb(); }
  }

  function bind() {
    $('grid').addEventListener('click', function (e) {
      var c = e.target.closest('.card'); if (!c) return;
      sel = Number(c.getAttribute('data-i')); renderGrid(); renderDetail();
      if (window.innerWidth <= 900) $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    $('detail').addEventListener('click', function (e) {
      var t = e.target.closest('button'); if (!t) return;
      if (t.id === 'b-choose') choose(); else if (t.id === 'b-copy') copy();
      else if (t.hasAttribute('data-mode')) { mode = t.getAttribute('data-mode'); renderDetail(); }
      else if (t.hasAttribute('data-wall')) { wall = t.getAttribute('data-wall'); renderDetail(); }
    });
  }

  async function init() {
    try { var r = JSON.parse(localStorage.getItem(LS) || 'null'); if (r && r.slug) { chosen = r; var i = LOGOS.findIndex(function (x) { return x.slug === r.slug; }); if (i >= 0) sel = i; } } catch (e) { /* ignorieren */ }
    renderGrid(); renderDetail(); bind();
    try {
      if (window.claude && window.claude.use) db = await window.claude.use('db');
      if (db) { var s = await db.doc('logo/choice').get(); if (s.exists) { var d = s.data(); if (d && d.slug) { chosen = d; var j = LOGOS.findIndex(function (x) { return x.slug === d.slug; }); if (j >= 0) sel = j; renderGrid(); renderDetail(); } } }
    } catch (e) { db = null; }
  }
  init();
})();
</script>
