<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Tracker</title>
  <meta name="description" content="Trainingstage planen, Sätze tracken und Satzpausen timen – offline.">

  <!-- PWA / iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">

  <!-- Gespeichertes Design sofort anwenden (kein Aufblitzen beim Start) -->
  <script>
    (function () {
      try {
        var d = document.documentElement;
        var acc = JSON.parse(localStorage.getItem('gymtracker.account.v1') || 'null');
        var key = 'gymtracker.data.v1' + (acc && acc.mode === 'user' && acc.uid ? '.u.' + acc.uid : '');
        var m = (localStorage.getItem(key) || '').match(/"theme":"(dark|light|system)"/);
        var t = m ? m[1] : 'dark';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        d.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#f2f2f2');
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', dark ? 'black-translucent' : 'default');
        if (navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) d.classList.add('standalone');
      } catch (e) { /* Standard: dunkel */ }
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" id="header"></header>

  <main class="view" id="view" tabindex="-1"></main>

  <!-- Satzpausen-Timer: schwebende Karte über der Navigation -->
  <section class="timer-bar" id="timer-bar" hidden aria-live="polite">
    <div class="timer-progress"><div class="timer-progress-fill" id="timer-fill"></div></div>
    <div class="timer-top">
      <span class="timer-label" id="timer-label">Pause</span>
      <button class="timer-x" data-timer="cancel" aria-label="Timer abbrechen">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        <span>Abbrechen</span>
      </button>
    </div>
    <div class="timer-row">
      <div class="timer-time" id="timer-time">0:00</div>
      <div class="timer-controls" id="timer-controls">
        <button class="tbtn" data-timer="minus" aria-label="15 Sekunden weniger">−15</button>
        <button class="tbtn" data-timer="plus" aria-label="15 Sekunden mehr">+15</button>
        <button class="tbtn tbtn-accent" data-timer="skip">Überspringen</button>
      </div>
      <div class="timer-controls" id="timer-done-controls" hidden>
        <button class="tbtn tbtn-accent tbtn-wide" data-timer="dismiss">Los geht’s</button>
      </div>
    </div>
  </section>

  <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation">
    <span class="tab-lens" id="tab-lens" aria-hidden="true"></span>
    <a href="#/" class="tab" data-tab="home">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
      <span>Training</span><i class="tab-dot" id="tab-dot" hidden></i>
    </a>
    <a href="#/history" class="tab" data-tab="history">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20h17M6 15.5l4-4.5 3.5 3L19 7.5"/></svg>
      <span>Verlauf</span>
    </a>
    <a href="#/food" class="tab" data-tab="food">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.3c-1.6-1.3-5.2-1.6-6.5 1.4-1.4 3 .1 7.8 2.5 10.3 1.2 1.3 2.4 1.4 4 .6 1.6.8 2.8.7 4-.6 2.4-2.5 3.9-7.3 2.5-10.3-1.3-3-4.9-2.7-6.5-1.4zM12 7.3c0-1.9.9-3.3 2.6-4.1"/></svg>
      <span>Ernährung</span>
    </a>
    <a href="#/library" class="tab" data-tab="library">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.4 5 8 4.5 4 4.5v14c4 0 6.4.5 8 2 1.6-1.5 4-2 8-2v-14c-4 0-6.4.5-8 2zM12 6.5v14"/></svg>
      <span>Bibliothek</span>
    </a>
    <a href="#/settings" class="tab" data-tab="settings">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      <span>Einstellungen</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
  <div id="modal-root"></div>

  <script src="firebase-config.js"></script>
  <script src="vendor/zxing.min.js"></script>
  <script src="app.js"></script>
  <script type="module" src="cloud.js"></script>
</body>
</html>
