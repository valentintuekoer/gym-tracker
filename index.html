<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Tracker</title>
  <meta name="description" content="Trainingstage planen, Sätze tracken und Satzpausen timen – offline.">

  <!-- PWA / iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0d10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" id="header"></header>

  <main class="view" id="view" tabindex="-1"></main>

  <!-- Satzpausen-Timer: feste Leiste über der Navigation -->
  <section class="timer-bar" id="timer-bar" hidden aria-live="polite">
    <div class="timer-progress"><div class="timer-progress-fill" id="timer-fill"></div></div>
    <div class="timer-top">
      <span class="timer-label" id="timer-label">Pause</span>
      <button class="timer-x" data-timer="cancel" aria-label="Timer abbrechen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg>
        <span>Abbrechen</span>
      </button>
    </div>
    <div class="timer-row">
      <div class="timer-time" id="timer-time">0:00</div>
      <div class="timer-controls" id="timer-controls">
        <button class="tbtn" data-timer="minus" aria-label="15 Sekunden weniger">−15</button>
        <button class="tbtn" data-timer="plus" aria-label="15 Sekunden mehr">+15</button>
        <button class="tbtn tbtn-accent" data-timer="skip">Überspringen</button>
      </div>
      <div class="timer-controls" id="timer-done-controls" hidden>
        <button class="tbtn tbtn-accent tbtn-wide" data-timer="dismiss">Los geht’s</button>
      </div>
    </div>
  </section>

  <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation">
    <a href="#/" class="tab" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h2v4H3zM19 10h2v4h-2zM6 7h3v10H6zM15 7h3v10h-3zM9 11h6v2H9z"/></svg>
      <span>Training</span><i class="tab-dot" id="tab-dot" hidden></i>
    </a>
    <a href="#/history" class="tab" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16v2H4zM5 12h3v6H5zM10.5 8h3v10h-3zM16 4h3v14h-3z"/></svg>
      <span>Verlauf</span>
    </a>
    <a href="#/settings" class="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.8 1.7 1l.4 2.5h4l.4-2.5c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4-2.1-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      <span>Einstellungen</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
  <div id="modal-root"></div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script type="module" src="cloud.js"></script>
</body>
</html>
