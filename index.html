<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Tracker</title>
  <meta name="description" content="Trainingstage planen, Sätze tracken und Satzpausen timen – offline.">

  <!-- PWA / iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#081120">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">

  <!-- Gespeichertes Design sofort anwenden (kein Aufblitzen beim Start) -->
  <script>
    (function () {
      try {
        var d = document.documentElement;
        var acc = JSON.parse(localStorage.getItem('gymtracker.account.v1') || 'null');
        var key = 'gymtracker.data.v1' + (acc && acc.mode === 'user' && acc.uid ? '.u.' + acc.uid : '');
        var m = (localStorage.getItem(key) || '').match(/"theme":"(dark|light|system)"/);
        var t = m ? m[1] : 'dark';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        d.setAttribute('data-theme', dark ? 'dark' : 'light');
        var g = (localStorage.getItem(key) || '').match(/"glass":(\d+)/);
        if (g) d.style.setProperty('--lg-tint', (Math.min(100, +g[1]) / 100).toFixed(2));
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#081120' : '#f1f4fb');
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', dark ? 'black-translucent' : 'default');
        if (navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) d.classList.add('standalone');
      } catch (e) { /* Standard: dunkel */ }
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" id="header"></header>

  <main class="view" id="view" tabindex="-1"></main>

  <!-- Satzpausen-Timer: schwebende Karte über der Navigation -->
  <section class="timer-bar" id="timer-bar" hidden aria-live="polite">
    <div class="timer-progress"><div class="timer-progress-fill" id="timer-fill"></div></div>
    <div class="timer-top">
      <span class="timer-label" id="timer-label">Pause</span>
      <button class="timer-x" data-timer="cancel" aria-label="Timer abbrechen">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        <span>Abbrechen</span>
      </button>
    </div>
    <div class="timer-row">
      <div class="timer-time" id="timer-time">0:00</div>
      <div class="timer-controls" id="timer-controls">
        <button class="tbtn" data-timer="minus" aria-label="15 Sekunden weniger">−15</button>
        <button class="tbtn" data-timer="plus" aria-label="15 Sekunden mehr">+15</button>
        <button class="tbtn tbtn-accent" data-timer="skip" aria-label="Pause überspringen"><span class="tbtn-long">Überspringen</span><span class="tbtn-short" aria-hidden="true">Weiter</span></button>
      </div>
      <div class="timer-controls" id="timer-done-controls" hidden>
        <button class="tbtn tbtn-accent tbtn-wide" data-timer="dismiss">Los geht’s</button>
      </div>
    </div>
  </section>

  <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation">
    <span class="tab-lens" id="tab-lens" aria-hidden="true"></span>
    <a href="#/" class="tab" data-tab="home">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
      <span>Training</span><i class="tab-dot" id="tab-dot" hidden></i>
    </a>
    <a href="#/daily" class="tab" data-tab="daily">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8.5 3v4M15.5 3v4M9 15l2 2 4-4"/></svg>
      <span>Daily</span>
    </a>
    <a href="#/chat" class="tab" data-tab="chat">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H11l-4.5 3.5V16.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5z"/></svg>
      <span>Chat</span><i class="tab-dot" id="tab-dot-chat" hidden></i>
    </a>
    <a href="#/profile" class="tab" data-tab="profile">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
      <span>Profil</span><i class="tab-dot" id="tab-dot-profile" hidden></i>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
  <div id="modal-root"></div>

  <script src="firebase-config.js"></script>
  <script src="vendor/zxing.min.js"></script>
  <script src="app.js"></script>
  <script type="module" src="cloud.js"></script>
</body>
</html>
